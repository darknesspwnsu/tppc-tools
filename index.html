<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#eef2ff" />
  <title>TPPC Tools by Darkness</title>
  <meta name="description" content="An index of useful TPPC tools and utilities by Darkness." />
  <meta property="og:title" content="TPPC Tools by Darkness" />
  <meta property="og:description" content="An index of useful TPPC tools and utilities by Darkness." />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css" />

  <style>
    :root{
      --bg0:#f6f7ff;
      --bg1:#eef2ff;
      --card:#ffffffcc;
      --card2:#ffffffa6;
      --panel:#ffffff;
      --text:#0b1020;
      --muted:#3b456b;
      --muted2:#59638c;
      --line:#d8def5;
      --accent:#5b46ff;
      --accent2:#00b7ff;
      --shadow: 0 14px 34px rgba(20,30,70,.14);
      --radius: 16px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    [data-theme="dark"]{
      --bg0:#070a12;
      --bg1:#0b1020;
      --card:#0e1730cc;
      --card2:#0e1730a6;
      --panel:#0e1730;
      --text:#e7ecff;
      --muted:#aab2d6;
      --muted2:#7f89b6;
      --line:#1c2a55;
      --accent:#7c5cff;
      --accent2:#39d3ff;
      --shadow: 0 16px 40px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }
    html, body{ min-height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1000px 500px at 20% 0%, rgba(91,70,255,.14), transparent 60%),
        radial-gradient(900px 520px at 92% 18%, rgba(0,183,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    a{ color:inherit; text-decoration:none; }

    .page-wrap{
      width:100%;
      max-width:1320px;
      margin:0 auto;
      padding:1rem 12px 46px;
      min-height:100vh;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:40px;
      height:40px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 10px 24px rgba(91,70,255,.25);
    }

    .brand h1{
      margin:0;
      font-size:16px;
      font-weight:700;
    }

    .sub{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
    }

    .actions{
      display:flex;
      gap:10px;
    }

    .btn{
      font-family:var(--mono);
      font-size:12px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card),var(--card2));
      color:var(--text);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:var(--shadow);
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 30%);
    }

    .hero{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(180deg,var(--card),var(--card2));
      box-shadow:var(--shadow);
      padding:1rem;
      margin-bottom:16px;
    }

    .hero h2{
      margin:0 0 10px;
      font-size:30px;
      letter-spacing:-.02em;
    }

    .hero p{
      margin:0;
      font-size:14px;
      color:var(--muted);
      line-height:1.6;
      max-width:72ch;
    }

    .hero a{ color:var(--accent); font-weight:600; }

    .toolsBar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin:14px 0 10px;
    }

    .sectionHead{
      font-family:var(--mono);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted2);
    }

    .rightMeta{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .count{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
      white-space:nowrap;
    }

    .searchWrap{
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:linear-gradient(180deg,var(--card),var(--card2));
      box-shadow:var(--shadow);
      min-width:min(420px,78vw);
    }

    .search{
      width:100%;
      border:none;
      background:transparent;
      outline:none;
      font-family:var(--mono);
      font-size:12.5px;
      color:var(--text);
    }

    /* Active tag chips shown near the count */
    .activeTags{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .chip{
      font-family:var(--mono);
      font-size:12px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card),var(--card2));
      box-shadow:var(--shadow);
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    .chip .x{
      border:0;
      background:transparent;
      cursor:pointer;
      color:var(--muted2);
      font-size:14px;
      line-height:1;
      padding:0;
    }
    .chip .x:hover{ color:var(--text); }

    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .tool{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
      padding:16px 18px;
      display:flex;
      justify-content:space-between;
      gap:16px;
      min-height:120px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .tool:hover{
      transform:translateY(-2px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 30%);
      box-shadow:0 18px 44px rgba(0,0,0,.18);
    }

    [data-theme="dark"] .tool:hover{
      box-shadow:0 20px 48px rgba(0,0,0,.55);
    }

    .toolMain{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }

    .tool h3{
      margin:0 0 6px;
      font-size:16px;
    }

    .tool p{
      margin:0;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    .meta{
      margin-top:auto;
      padding-top:10px;
      font-family:var(--mono);
      font-size:11.5px;
      color:var(--muted2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .tool .open{
      align-self:center;
      font-family:var(--mono);
      font-size:12px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:linear-gradient(135deg,rgba(91,70,255,.28),rgba(0,183,255,.24));
      white-space:nowrap;
    }

    .tool:hover .open{
      transform:translateY(-1px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 40%);
    }

    /* Tag pills inside each card */
    .pills{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
    .pill{
      font-family:var(--mono);
      font-size:11.5px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card),var(--card2));
      color:var(--muted2);
      cursor:pointer;
      transition:transform .12s ease, border-color .12s ease, color .12s ease;
    }
    .pill:hover{
      transform:translateY(-1px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 35%);
      color:var(--text);
    }
    .pill.active{
      border-color:transparent;
      color:var(--text);
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(135deg, rgba(72,255,190,.75), rgba(0,183,255,.75), rgba(91,70,255,.75)) border-box;
      box-shadow:0 14px 34px rgba(0,183,255,.14);
    }

    /* Highlight any tool matching at least one active tag */
    .tool.tag-hit{
      border-color:transparent;
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(135deg, rgba(72,255,190,.70), rgba(0,183,255,.70), rgba(91,70,255,.70)) border-box;
      box-shadow:0 18px 44px rgba(0,183,255,.16), var(--shadow);
    }

    footer{
      margin-top:32px;
      display:flex;
      justify-content:space-between;
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
    }

    @media(max-width:720px){
      .toolsBar{flex-direction:column; align-items:stretch;}
      .rightMeta{justify-content:space-between;}
      .searchWrap{min-width:100%;}
      .tool{align-items:flex-start;}
      .open{align-self:flex-start;}
    }
  </style>
</head>

<body>
    <div class="page-wrap">
    <section class="hero">
      <h2>An index of useful TPPC tools and utilities</h2>
      <p>
        Quick text organizers and calculators built for TPPC players.<br>
        For other rarity tools and organizers by Yoko, check out
        <a href="https://tppc.electa.buzz/" target="_blank">https://tppc.electa.buzz/</a>
      </p>
    </section>

    <div class="toolsBar">
      <div class="sectionHead">Tools</div>
      <div class="rightMeta">
        <div class="activeTags" id="activeTags"></div>
        <div class="count" id="countText"></div>
        <div class="searchWrap">
          ⌕ <input id="search" class="search" placeholder="Search tools…" />
        </div>
      </div>
    </div>

    <div class="list" id="list"></div>

    
  </div>

  <script src="/assets/tools.js"></script>
  <script>
    const TOOLS = window.TPPC_TOOLS || [];

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const count = document.getElementById("countText");
    const activeTagsEl = document.getElementById("activeTags");

    const safeHost = u => {
      try{ const x=new URL(u); return x.host + x.pathname; }catch{ return u; }
    };

    const normTag = s => String(s||"").trim().toLowerCase();
    const toolTags = t => (t.tags||[]).map(normTag).filter(Boolean);

    let activeTags = new Set(); // from hash
    let isHashDriving = false;

    function parseHash(){
      // supports:
      //  #calculator
      //  #tag=calculator,exp
      //  #q=money
      //  #tag=calculator,exp&q=money   (hash mini-querystring)
      const raw = (location.hash || "").replace(/^#/, "").trim();
      const out = { tags: [], q: "" };
      if (!raw) return out;

      if (!raw.includes("=")){
        out.tags = raw.split(",").map(decodeURIComponent).map(normTag).filter(Boolean);
        return out;
      }

      const pairs = raw.split("&").map(s => s.split("="));
      for (const [k,v] of pairs){
        const key = normTag(k);
        const val = decodeURIComponent(v || "");
        if (key === "tag") out.tags = val.split(",").map(normTag).filter(Boolean);
        if (key === "q") out.q = val;
      }
      return out;
    }

    function writeHash({ tags, q }){
      const parts = [];
      if (tags && tags.length) parts.push("tag=" + encodeURIComponent(tags.join(",")));
      if (q) parts.push("q=" + encodeURIComponent(q));
      const h = parts.length ? "#" + parts.join("&") : "#";

      // prevent applyHash loops
      isHashDriving = true;
      location.hash = h;
      setTimeout(()=>{ isHashDriving = false; }, 0);
    }

    function tagMatchCount(t){
      if (!activeTags.size) return 0;
      let n = 0;
      for (const tg of toolTags(t)) if (activeTags.has(tg)) n++;
      return n;
    }

    function renderActiveTags(){
      activeTagsEl.innerHTML = "";
      const tags = Array.from(activeTags).sort();
      if (!tags.length) return;

      tags.forEach(t=>{
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = `#${t} <button class="x" title="Remove tag" aria-label="Remove tag">×</button>`;
        chip.querySelector(".x").onclick = (e)=>{
          e.stopPropagation();
          activeTags.delete(t);
          writeHash({ tags: Array.from(activeTags).sort(), q: "" });
          applyFilters();
        };
        activeTagsEl.appendChild(chip);
      });

      const clear = document.createElement("span");
      clear.className = "chip";
      clear.innerHTML = `Clear <button class="x" title="Clear tags" aria-label="Clear tags">×</button>`;
      clear.querySelector(".x").onclick = (e)=>{
        e.stopPropagation();
        activeTags.clear();
        writeHash({ tags: [], q: search.value.trim() ? search.value.trim() : "" });
        applyFilters();
      };
      activeTagsEl.appendChild(clear);
    }

    function render(items){
      // sort to top by number of matching tags (multi-tag = higher), then alphabetically
      const out = items.slice().sort((a,b)=>{
        const da = tagMatchCount(a), db = tagMatchCount(b);
        if (db !== da) return db - da;
        return a.name.localeCompare(b.name);
      });

      list.innerHTML = "";
      out.forEach(t=>{
        const card = document.createElement("div");
        card.className = "tool";
        card.tabIndex = 0;

        const m = tagMatchCount(t);
        if (m > 0) card.classList.add("tag-hit");

        const tags = toolTags(t);
        const pillsHtml = tags.length ? `
          <div class="pills">
            ${tags.map(tag=>{
              const on = activeTags.has(tag) ? "active" : "";
              return `<button class="pill ${on}" type="button" data-tag="${tag}">#${tag}</button>`;
            }).join("")}
          </div>
        ` : "";

        card.innerHTML = `
          <div class="toolMain">
            <h3>${t.name}</h3>
            <p>${t.desc}</p>
            <div class="meta">${safeHost(t.url)}</div>
            ${pillsHtml}
          </div>
          <a class="open" href="${t.url}" target="_blank" rel="noopener">Open →</a>
        `;

        // pill clicks update hash
        card.querySelectorAll(".pill").forEach(btn=>{
          btn.addEventListener("click",(e)=>{
            e.stopPropagation();
            const tag = normTag(btn.getAttribute("data-tag"));
            const multi = e.ctrlKey || e.metaKey;

            if (multi){
              if (activeTags.has(tag)) activeTags.delete(tag);
              else activeTags.add(tag);
            } else {
              activeTags = new Set([tag]);
            }

            // tag mode clears search query (keeps behavior predictable)
            search.value = "";
            writeHash({ tags: Array.from(activeTags).sort(), q: "" });
            applyFilters();
          });
        });

        card.addEventListener("click",e=>{
          if (e.target.closest("a") || e.target.closest("button")) return;
          window.open(t.url,"_blank","noopener");
        });
        card.addEventListener("keydown",e=>{
          if(e.key==="Enter"||e.key===" "){
            if (document.activeElement && document.activeElement.classList.contains("pill")) return;
            e.preventDefault();
            window.open(t.url,"_blank","noopener");
          }
        });

        list.appendChild(card);
      });

      count.textContent = `${out.length} / ${TOOLS.length} shown`;
      renderActiveTags();
    }

    function applyFilters(){
      const q = search.value.toLowerCase().trim();

      const filtered = !q ? TOOLS : TOOLS.filter(t => {
        const haystack =
          (t.name || "") + " " +
          (t.desc || "") + " " +
          (t.url  || "") + " " +
          ((t.tags || []).join(" "));

        return haystack.toLowerCase().includes(q);
      });

      render(filtered);
    }

    function applyHash(){
      const { tags, q } = parseHash();
      activeTags = new Set(tags.map(normTag).filter(Boolean));

      // hash query sets the search box; tag-only hashes keep search empty
      search.value = (q || "").trim();

      applyFilters();
    }

    // search typing => search mode, clears tags, writes #q=
    search.addEventListener("input",()=>{
      if (isHashDriving) return;
      const q = search.value.trim();
      activeTags.clear();
      writeHash({ tags: [], q });
      applyFilters();
    });

    window.addEventListener("hashchange", applyHash);

    applyHash(); // initial render respects hash if present
  </script>
  <script defer src="/assets/site.js"></script>
</body>
</html>
