<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#eef2ff" />
  <title>TPPC Tools by Darkness</title>
  <meta name="description" content="An index of useful TPPC tools and utilities by Darkness." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#f6f7ff;
      --bg1:#eef2ff;
      --card:#ffffffcc;
      --card2:#ffffffa6;
      --panel:#ffffff;
      --text:#0b1020;
      --muted:#3b456b;
      --muted2:#59638c;
      --line:#d8def5;
      --accent:#5b46ff;
      --accent2:#00b7ff;
      --shadow: 0 14px 34px rgba(20,30,70,.14);
      --radius: 16px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    [data-theme="dark"]{
      --bg0:#070a12;
      --bg1:#0b1020;
      --card:#0e1730cc;
      --card2:#0e1730a6;
      --panel:#0e1730;
      --text:#e7ecff;
      --muted:#aab2d6;
      --muted2:#7f89b6;
      --line:#1c2a55;
      --accent:#7c5cff;
      --accent2:#39d3ff;
      --shadow: 0 16px 40px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }
    html, body{ min-height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1000px 500px at 20% 0%, rgba(91,70,255,.14), transparent 60%),
        radial-gradient(900px 520px at 92% 18%, rgba(0,183,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      width:min(980px, 92vw);
      margin:0 auto;
      padding:28px 0 46px;
      min-height:100vh;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:40px;
      height:40px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      box-shadow:0 10px 24px rgba(91,70,255,.25);
    }

    .brand h1{
      margin:0;
      font-size:16px;
      font-weight:700;
    }

    .sub{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
    }

    .actions{
      display:flex;
      gap:10px;
    }

    .btn{
      font-family:var(--mono);
      font-size:12px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card),var(--card2));
      color:var(--text);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      box-shadow:var(--shadow);
    }

    .btn:hover{
      transform:translateY(-1px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 30%);
    }

    .hero{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:linear-gradient(180deg,var(--card),var(--card2));
      box-shadow:var(--shadow);
      padding:22px;
      margin-bottom:16px;
    }

    .hero h2{
      margin:0 0 10px;
      font-size:30px;
      letter-spacing:-.02em;
    }

    .hero p{
      margin:0;
      font-size:14px;
      color:var(--muted);
      line-height:1.6;
      max-width:72ch;
    }

    .hero a{ color:var(--accent); font-weight:600; }

    .toolsBar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin:14px 0 10px;
    }

    .sectionHead{
      font-family:var(--mono);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted2);
    }

    .rightMeta{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .count{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
    }

    .searchWrap{
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px 12px;
      background:linear-gradient(180deg,var(--card),var(--card2));
      box-shadow:var(--shadow);
      min-width:min(420px,78vw);
    }

    .search{
      width:100%;
      border:none;
      background:transparent;
      outline:none;
      font-family:var(--mono);
      font-size:12.5px;
      color:var(--text);
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .tool{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
      padding:16px 18px;
      display:flex;
      justify-content:space-between;
      gap:16px;
      min-height:120px;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .tool:hover{
      transform:translateY(-2px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 30%);
      box-shadow:0 18px 44px rgba(0,0,0,.18);
    }

    [data-theme="dark"] .tool:hover{
      box-shadow:0 20px 48px rgba(0,0,0,.55);
    }

    .toolMain{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width:0;
    }

    .tool h3{
      margin:0 0 6px;
      font-size:16px;
    }

    .tool p{
      margin:0;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    .meta{
      margin-top:auto;
      padding-top:10px;
      font-family:var(--mono);
      font-size:11.5px;
      color:var(--muted2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .open{
      align-self:center;
      font-family:var(--mono);
      font-size:12px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:linear-gradient(135deg,rgba(91,70,255,.15),rgba(0,183,255,.12));
      white-space:nowrap;
    }

    .tool:hover .open{
      transform:translateY(-1px);
      border-color:color-mix(in oklab,var(--line),var(--accent2) 40%);
    }

    footer{
      margin-top:32px;
      display:flex;
      justify-content:space-between;
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
    }

    @media(max-width:720px){
      .toolsBar{flex-direction:column; align-items:stretch;}
      .rightMeta{justify-content:space-between;}
      .searchWrap{min-width:100%;}
      .tool{align-items:flex-start;}
      .open{align-self:flex-start;}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>TPPC Tools by Darkness</h1>
          <div class="sub">utilities • organizers • calculators</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn" href="https://github.com/coldsp33d" target="_blank">↗ GitHub</a>
        <button id="themeBtn" class="btn">
          <span id="themeIcon">☾</span>
          <span id="themeText">Dark</span>
        </button>
      </div>
    </div>

    <section class="hero">
      <h2>An index of useful TPPC tools and utilities</h2>
      <p>
        Quick text organizers and calculators built for TPPC players.<br>
        For other rarity tools and organizers by Yoko, check out
        <a href="https://tppc.electa.buzz/" target="_blank">https://tppc.electa.buzz/</a>
      </p>
    </section>

    <div class="toolsBar">
      <div class="sectionHead">Tools</div>
      <div class="rightMeta">
        <div class="count" id="countText"></div>
        <div class="searchWrap">
          ⌕ <input id="search" class="search" placeholder="Search tools…" />
        </div>
      </div>
    </div>

    <div class="list" id="list"></div>

    <footer>
      <div>© <span id="year"></span> Darkness</div>
      <div>GitHub Pages</div>
    </footer>
  </div>

  <script>
    const TOOLS = [
      { name:"Box Organizer", url:"https://coldsp33d.github.io/box_organizer", desc:"Organize Pokémon quickly and effectively into logically sensible groups with several options for customization." },
      { name:"Perfect Exp Calculator", url:"https://coldsp33d.github.io/perfect_exp", desc:"Calculate the number of battles needed to perfect EXP a Pokémon at any level." },
      { name:"Exp Utilities", url:"https://coldsp33d.github.io/exp_utils", desc:"Useful powertools for trainers." },
      { name:"PokeSprite Generator", url:"https://coldsp33d.github.io/pokesprite_generator", desc:"Generate PokeSprites in BBCode to post in your threads!" },
      { name:"Ungendered (?) Collection Sorter", url:"https://coldsp33d.github.io/sort_ungendered", desc:"Sorts ungendered Pokémon collections by families and lists missing Pokémon." },
      { name:"Ungendered (?) Collection Diffchecker", url:"https://coldsp33d.github.io/diff_ungendered", desc:"Diffs two (?) collections and helps collectors quickly figure out swap trades." },
      { name:"Rainbow Dex Organizer", url:"https://coldsp33d.github.io/rainbow_dex_sorter", desc:"Helps organize rainbow dex collections easily. This is really only for kobk :p" }
    ];

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const count = document.getElementById("countText");

    const safeHost = u => {
      try{ const x=new URL(u); return x.host + x.pathname; }catch{ return u; }
    };

    function render(items){
      list.innerHTML="";
      items.forEach(t=>{
        const card=document.createElement("div");
        card.className="tool";
        card.tabIndex=0;
        card.innerHTML=`
          <div class="toolMain">
            <h3>${t.name}</h3>
            <p>${t.desc}</p>
            <div class="meta">${safeHost(t.url)}</div>
          </div>
          <a class="open" href="${t.url}" target="_blank">Open →</a>
        `;
        card.addEventListener("click",e=>{
          if(e.target.closest("a")) return;
          window.open(t.url,"_blank","noopener");
        });
        card.addEventListener("keydown",e=>{
          if(e.key==="Enter"||e.key===" "){
            e.preventDefault();
            window.open(t.url,"_blank","noopener");
          }
        });
        list.appendChild(card);
      });
      count.textContent=`${items.length} / ${TOOLS.length} shown`;
    }

    search.addEventListener("input",()=>{
      const q=search.value.toLowerCase().trim();
      render(!q?TOOLS:TOOLS.filter(t=>(t.name+t.desc+t.url).toLowerCase().includes(q)));
    });

    // theme toggle
    const root=document.documentElement;
    const btn=document.getElementById("themeBtn");
    const icon=document.getElementById("themeIcon");
    const text=document.getElementById("themeText");
    const saved=localStorage.getItem("tppc_tools_theme")||"light";
    setTheme(saved);

    function setTheme(m){
      root.setAttribute("data-theme",m);
      localStorage.setItem("tppc_tools_theme",m);
      const dark=m==="dark";
      icon.textContent=dark?"☀":"☾";
      text.textContent=dark?"Light":"Dark";
      document.querySelector('meta[name="theme-color"]').setAttribute("content",dark?"#0b1020":"#eef2ff");
    }

    btn.onclick=()=>setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark");

    document.getElementById("year").textContent=new Date().getFullYear();
    render(TOOLS);
  </script>
</body>
</html>
