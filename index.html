<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#eef2ff" />
  <title>TPPC Tools by Darkness</title>
  <meta name="description" content="An index of useful TPPC tools and utilities by Darkness." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#f6f7ff;
      --bg1:#eef2ff;
      --card:#ffffffcc;
      --card2:#ffffffa6;
      --panel:#ffffff;
      --text:#0b1020;
      --muted:#3b456b;
      --muted2:#59638c;
      --line:#d8def5;
      --accent:#5b46ff;
      --accent2:#00b7ff;
      --shadow: 0 14px 34px rgba(20,30,70,.14);
      --radius: 16px;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    [data-theme="dark"]{
      --bg0:#070a12;
      --bg1:#0b1020;
      --card:#0e1730cc;
      --card2:#0e1730a6;
      --panel:#0e1730;
      --text:#e7ecff;
      --muted:#aab2d6;
      --muted2:#7f89b6;
      --line:#1c2a55;
      --accent:#7c5cff;
      --accent2:#39d3ff;
      --shadow: 0 16px 40px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }
    html, body{ min-height: 100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1000px 500px at 20% 0%, rgba(91,70,255,.14), transparent 60%),
        radial-gradient(900px 520px at 92% 18%, rgba(0,183,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    a{ color:inherit; text-decoration:none; }
    .wrap{
      width:min(980px, 92vw);
      margin:0 auto;
      padding:28px 0 46px;
      min-height: 100vh; /* ensures background looks consistent */
    }

    /* Top bar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:22px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 240px;
    }

    .logo{
      width:40px;height:40px;
      border-radius:12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 24px rgba(91,70,255,.25);
      position:relative;
      overflow:hidden;
    }

    .logo:after{
      content:"";
      position:absolute; inset:-55%;
      background: conic-gradient(from 180deg, transparent, rgba(255,255,255,.45), transparent);
      animation: spin 10s linear infinite;
      opacity:.35;
      pointer-events:none;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    .brand h1{
      margin:0;
      font-size:16px;
      font-weight:700;
      letter-spacing:.1px;
    }

    .sub{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
      margin-top:2px;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      font-family:var(--mono);
      font-size:12px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      color: var(--text);
      background: linear-gradient(180deg, var(--card), var(--card2));
      cursor:pointer;
      box-shadow: 0 10px 22px rgba(20,30,70,.08);
      transition: transform .15s ease, border-color .15s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: color-mix(in oklab, var(--line), var(--accent2) 28%);
    }
    .btn:active{ transform: translateY(0px) scale(.99); }
    .btn:focus-visible{ outline:2px solid color-mix(in oklab, var(--accent2), white 22%); outline-offset:2px; }

    /* Hero */
    .hero{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: var(--shadow);
      padding:22px;
      margin-bottom:16px;
    }

    .hero h2{
      margin:0 0 10px;
      font-size:30px;
      letter-spacing:-.02em;
    }

    .hero p{
      margin:0;
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
      max-width:72ch;
    }

    .hero a{
      color:var(--accent);
      font-weight:600;
    }

    /* Search row */
    .toolsBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin: 14px 0 10px;
    }

    .sectionHead{
      font-family:var(--mono);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted2);
      margin:0;
    }

    .rightMeta{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .count{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted2);
    }

    .searchWrap{
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      border-radius: 14px;
      padding:10px 12px;
      background: linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: var(--shadow);
      min-width: min(420px, 78vw);
    }

    .searchIcon{
      font-family:var(--mono);
      color:var(--muted2);
      font-size:12px;
      opacity:.9;
    }

    .search{
      width:100%;
      border:none;
      background:transparent;
      outline:none;
      color:var(--text);
      font-family:var(--mono);
      font-size:12.5px;
      letter-spacing:.1px;
    }
    .search::placeholder{ color: color-mix(in oklab, var(--muted2), var(--text) 8%); }

    /* Tools list */
    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .tool{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding:16px 18px;
      display:flex;
      gap:16px;
      justify-content:space-between;

      /* equal-feel cards */
      min-height: 120px;
    }

    /* Left column becomes a vertical flexbox so .meta can hug bottom */
    .toolMain{
      display:flex;
      flex-direction:column;
      flex:1;
      min-width: 0;
    }

    .tool h3{
      margin:0 0 6px;
      font-size:16px;
      letter-spacing:-.01em;
    }

    .tool p{
      margin:0;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
      max-width:72ch;
    }

    .meta{
      font-family:var(--mono);
      font-size:11.5px;
      color:var(--muted2);
      margin-top:auto;              /* hugs bottom */
      padding-top:10px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 100%;
    }

    .open{
      font-family:var(--mono);
      font-size:12px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background: linear-gradient(135deg, rgba(91,70,255,.15), rgba(0,183,255,.12));
      white-space:nowrap;

      /* critical: don't stretch */
      align-self:center;
      flex: 0 0 auto;
      transition: transform .15s ease, border-color .15s ease;
    }

    .open:hover{
      transform: translateY(-1px);
      border-color: color-mix(in oklab, var(--line), var(--accent2) 26%);
    }

    footer{
      margin-top:32px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      font-size:12px;
      color:var(--muted2);
      font-family:var(--mono);
    }

    @media (max-width: 720px){
      .toolsBar{ align-items:stretch; flex-direction:column; }
      .rightMeta{ justify-content:space-between; }
      .searchWrap{ min-width: 100%; }
      .tool{ align-items:flex-start; }
      .open{ align-self:flex-start; }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>TPPC Tools by Darkness</h1>
          <div class="sub">utilities • organizers • calculators</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="https://github.com/coldsp33d" target="_blank" rel="noreferrer">
          <span aria-hidden="true">↗</span> GitHub
        </a>
        <button id="themeBtn" class="btn" type="button" aria-label="Toggle theme">
          <span id="themeIcon">☾</span>
          <span id="themeText">Dark</span>
        </button>
      </div>
    </div>

    <section class="hero">
      <h2>An index of useful TPPC tools and utilities</h2>
      <p>
        Quick text organizers and calculators built for TPPC players.<br>
        For other rarity tools and organizers by Yoko, check out
        <a href="https://tppc.electa.buzz/" target="_blank" rel="noreferrer">https://tppc.electa.buzz/</a>
      </p>
    </section>

    <div class="toolsBar">
      <p class="sectionHead">Tools</p>

      <div class="rightMeta">
        <div class="count" id="countText"></div>
        <div class="searchWrap" role="search" aria-label="Search tools">
          <div class="searchIcon" aria-hidden="true">⌕</div>
          <input id="search" class="search" type="search" placeholder="Search tools…" autocomplete="off" />
        </div>
      </div>
    </div>

    <div class="list" id="list" aria-label="Tool list"></div>

    <footer>
      <div>© <span id="year"></span> Darkness</div>
      <div>GitHub Pages</div>
    </footer>
  </div>

  <script>
    // --- Tool Catalog (add new tools here) ---
    const TOOLS = [
      {
        name: "Box Organizer",
        url: "https://coldsp33d.github.io/box_organizer",
        desc: "Organize Pokémon quickly and effectively into logically sensible groups with several options for customization.",
        tag: "organizer"
      },
      {
        name: "Perfect Exp Calculator",
        url: "https://coldsp33d.github.io/perfect_exp",
        desc: "Calculate the number of battles needed to perfect EXP a Pokémon at any level.",
        tag: "calculator"
      },
      {
        name: "Exp Utilities",
        url: "https://coldsp33d.github.io/exp_utils",
        desc: "Useful powertools for trainers.",
        tag: "powertools"
      },
      {
        name: "PokeSprite Generator",
        url: "https://coldsp33d.github.io/pokesprite_generator",
        desc: "Generate PokeSprites in BBCode to post in your threads!",
        tag: "powertools"
      },
      {
        name: "Ungendered (?) Collection Sorter",
        url: "https://coldsp33d.github.io/sort_ungendered",
        desc: "Sorts ungendered Pokémon collections by families and lists missing Pokémon.",
        tag: "(?)"
      },
      {
        name: "Ungendered (?) Collection Diffchecker",
        url: "https://coldsp33d.github.io/diff_ungendered",
        desc: "Diffs two (?) collections and helps collectors quickly figure out how to setup swap trades.",
        tag: "(?)"
      },
      {
        name: "Rainbow Dex Organizer",
        url: "https://coldsp33d.github.io/rainbow_dex_sorter",
        desc: "I built this to help kobk organize his rainbow dex easily.",
        tag: "organizer"
      },
    ];

    const listEl = document.getElementById("list");
    const searchEl = document.getElementById("search");
    const countEl = document.getElementById("countText");

    const safeHost = (u) => {
      try { return new URL(u).host + new URL(u).pathname; } catch { return u; }
    };

    const esc = (s) => String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");

    function render(tools){
      listEl.innerHTML = "";
      const frag = document.createDocumentFragment();

      tools.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "tool";

        row.innerHTML = `
          <div class="toolMain">
            <h3>${esc(t.name)}</h3>
            <p>${esc(t.desc)}</p>
            <div class="meta">${esc(safeHost(t.url))}</div>
          </div>
          <a class="open" href="${esc(t.url)}" target="_blank" rel="noreferrer">Open →</a>
        `;

        // Subtle enter animation (from the first iteration), safe + minimal
        row.style.opacity = "0";
        row.style.transform = "translateY(6px)";
        requestAnimationFrame(() => {
          row.style.transition = "opacity .32s ease, transform .32s ease";
          row.style.transitionDelay = (i * 35) + "ms";
          row.style.opacity = "1";
          row.style.transform = "translateY(0px)";
        });

        frag.appendChild(row);
      });

      listEl.appendChild(frag);
      countEl.textContent = `${tools.length} / ${TOOLS.length} shown`;
    }

    function applyFilter(){
      const q = (searchEl.value || "").toLowerCase().trim();
      if(!q){ render(TOOLS); return; }

      const filtered = TOOLS.filter(t => {
        const hay = `${t.name} ${t.desc} ${t.tag || ""} ${t.url}`.toLowerCase();
        return hay.includes(q);
      });
      render(filtered);
    }

    // Init
    render(TOOLS);
    document.getElementById("year").textContent = new Date().getFullYear();

    // Filter
    let tmr = null;
    searchEl.addEventListener("input", () => {
      clearTimeout(tmr);
      tmr = setTimeout(applyFilter, 60);
    });

    // --- Theme toggle (default = light) ---
    const root = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.getElementById("themeText");

    // Always default to light unless user previously chose dark
    const savedTheme = localStorage.getItem("tppc_tools_theme") || "light";
    setTheme(savedTheme);

    function setTheme(mode){
      root.setAttribute("data-theme", mode);
      localStorage.setItem("tppc_tools_theme", mode);

      const isDark = mode === "dark";
      themeIcon.textContent = isDark ? "☀" : "☾";
      themeText.textContent = isDark ? "Light" : "Dark";

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", isDark ? "#0b1020" : "#eef2ff");
    }

    themeBtn.addEventListener("click", () => {
      const current = root.getAttribute("data-theme");
      setTheme(current === "dark" ? "light" : "dark");
    });

  </script>
</body>
</html>
