<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TPPC (?) Dex Sorter & Stats (Web)</title>
  <!-- Bootstrap CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body { padding-top: 1.5rem; padding-bottom: 1.5rem; }
    textarea { font-family: monospace; font-size: 0.9rem; }
  </style>
</head>

<body>
<div class="container" id="app">
  <!-- Input view -->
  <div id="input-view">
    <h1 class="mb-3">TPPC (?) Dex Sorter & Stats (Web)</h1>

    <div class="mb-3">
      <label for="inputList" class="form-label">Paste your TPPC Pokémon list here</label>
      <textarea id="inputList" class="form-control" rows="15"
        placeholder='Example:&#10;DarkBulbasaur (?) 20 $40,005&#10;ShinyBulbasaur (?) 20 $40,005&#10;Bulbasaur (?) 4 $625'></textarea>
    </div>

    <div class="row mb-3">
      <div class="col-md-4 mb-3 mb-md-0">
        <label for="minUngendered" class="form-label">Min Ungendered</label>
        <input type="number" class="form-control" id="minUngendered" value="10" min="0" />
      </div>
      <div class="col-md-4 mb-3 mb-md-0">
        <label for="maxMissing" class="form-label">Max Missing</label>
        <input type="number" class="form-control" id="maxMissing" value="20" min="0" />
        <div class="form-text">0 = show all missing entries</div>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="partitionOutput" />
          <label class="form-check-label" for="partitionOutput">
            Partition sorted output into Families vs Singles/Sets
          </label>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="row mb-3">
      <div class="col-md-3 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filterGolds" />
          <label class="form-check-label" for="filterGolds">
            Filter out Goldens (also exclude Goldens in missing list)
          </label>
        </div>
      </div>
      <div class="col-md-3 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filterNormals" />
          <label class="form-check-label" for="filterNormals">
            Filter out Normals (also exclude Normals in missing list)
          </label>
        </div>
      </div>
      <div class="col-md-3 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filterShinys" />
          <label class="form-check-label" for="filterShinys">
            Filter out Shinys (also exclude Shinys in missing list)
          </label>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="filterDarks" />
          <label class="form-check-label" for="filterDarks">
            Filter out Darks (also exclude Darks in missing list)
          </label>
        </div>
      </div>
    </div>

    <!-- Options -->
    <div class="row mb-3">
      <div class="col-md-4 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="missingOnlyFamilyNeeded" />
          <label class="form-check-label" for="missingOnlyFamilyNeeded">
            Missing list: only entries needed to complete incomplete families
          </label>
        </div>
      </div>

      <div class="col-md-4 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="addMissingInline" />
          <label class="form-check-label" for="addMissingInline">
            Add missing items inline (in Families output)
          </label>
        </div>
      </div>

      <div class="col-md-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="noGroupSpacing" />
          <label class="form-check-label" for="noGroupSpacing">
            No space between familys/individuals
          </label>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="showLevelLabel" />
          <label class="form-check-label" for="showLevelLabel">
            Output level as (Level: X) instead of just X
          </label>
        </div>
      </div>

      <div class="col-md-4 mb-2 mb-md-0">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="dropDuplicates" checked />
          <label class="form-check-label" for="dropDuplicates">
            Drop duplicates (keep the lowest-level one)
          </label>
        </div>
      </div>
    </div>

    <!-- Colors -->
    <div class="row mb-3">
      <div class="col-md-3 mb-3 mb-md-0">
        <label for="colorGolden" class="form-label">Golden color</label>
        <input type="text" class="form-control" id="colorGolden" value="gold" placeholder='e.g. gold or #FFD700' />
      </div>
      <div class="col-md-3 mb-3 mb-md-0">
        <label for="colorShiny" class="form-label">Shiny color</label>
        <input type="text" class="form-control" id="colorShiny" value="magenta" placeholder='e.g. magenta or #FF00FF' />
      </div>
      <div class="col-md-3 mb-3 mb-md-0">
        <label for="colorDark" class="form-label">Dark color</label>
        <input type="text" class="form-control" id="colorDark" value="blue" placeholder='e.g. blue or #0000FF' />
      </div>
      <div class="col-md-3 mb-3 mb-md-0">
        <label for="colorNormal" class="form-label">Normal color</label>
        <input type="text" class="form-control" id="colorNormal" value="" placeholder='leave blank = no color' />
      </div>
    </div>

    <button id="runButton" class="btn btn-primary">Generate BBCode & Stats</button>
    <div class="mt-3 small text-muted" id="status"></div>
  </div>

  <!-- Output view -->
  <div id="output-view" class="d-none">
    <h2 class="mb-3">Output</h2>
    <p class="text-muted">Copy this text to your TPPC forum post / notes.</p>

    <label for="outputText" class="form-label">Summary + Families BBCode</label>
    <textarea id="outputText" class="form-control mb-3" rows="20"></textarea>

    <div id="familiesSinglesBlock" class="d-none">
      <label for="outputSingles" class="form-label mt-3">Singles/Sets BBCode</label>
      <textarea id="outputSingles" class="form-control mb-3" rows="20"></textarea>
    </div>

    <label for="outputMissing" class="form-label mt-3">Missing list (per variant)</label>
    <textarea id="outputMissing" class="form-control" rows="12"></textarea>

    <button id="backButton" class="btn btn-secondary mt-3">Back to input</button>
  </div>
</div>

<script>
// ===============================
// Utility helpers
// ===============================

// Remove color prefixes (Shiny/Dark/Golden) whether it's "DarkFoo" or "Dark Foo"
function stripPrefixes(name) {
  return name
    .replace(/^(shiny|dark|golden)\s*/i, "")
    .replace(/^(shiny|dark|golden)/i, "")
    .trim();
}

function speciesFromFullName(fullName) {
  const noPrefix = stripPrefixes(fullName);
  return noPrefix.split("(")[0].trim();
}

function canonicalKey(name) {
  let norm = name.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  norm = norm.replace("♀", "F").replace("♂", "M");
  norm = norm.toLowerCase();
  const stripped = norm.replace(/[^a-z0-9]/g, "");
  if (stripped.startsWith("unown") && stripped.length > "unown".length) return "unown";
  return stripped;
}

function extractForm(fullName) {
  const noPrefix = stripPrefixes(fullName);
  const m = noPrefix.match(/\(([^)]+)\)/);
  if (!m) return "";
  const form = m[1].trim();
  // "(?)" is the ungendered marker, not a form
  if (form === "?") return "";
  return form;
}

const FORM_PRIORITY = { "": 0, "normal": 0, "alola": 1, "galarian": 2, "hisui": 3, "paldea": 4 };
function formRank(form) { return FORM_PRIORITY[form.toLowerCase()] ?? 10; }

function colorCategory(name) {
  const n = name.trim().toLowerCase();
  if (n.startsWith("golden")) return "golden";
  if (n.startsWith("shiny")) return "shiny";
  if (n.startsWith("dark")) return "dark";
  return "normal";
}

function colorRank(name) {
  // Normal (0) < Dark (1) < Shiny (2) < Golden (3)
  const cat = colorCategory(name);
  if (cat === "golden") return 3;
  if (cat === "shiny") return 2;
  if (cat === "dark") return 1;
  return 0;
}

function compareTuple(a, b) {
  const len = Math.min(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const av = a[i], bv = b[i];
    if (av < bv) return -1;
    if (av > bv) return 1;
  }
  return 0;
}

function applyLevelLabelToRemainder(remainder) {
  const m = remainder.match(/^(\d[\d,]*)(\b.*)?$/);
  if (!m) return remainder;
  const lvl = m[1];
  const tail = (m[2] || "").trim();
  return tail ? `(Level: ${lvl}) ${tail}` : `(Level: ${lvl})`;
}

function parseLeadingLevelFromRemainder(remainder) {
  const m = (remainder || "").match(/^(\d[\d,]*)\b/);
  if (!m) return { levelNum: null, levelStr: null };
  const s = m[1];
  const n = parseInt(s.replace(/,/g, ""), 10);
  return Number.isFinite(n) ? { levelNum: n, levelStr: s } : { levelNum: null, levelStr: s };
}

function decorateMissingInline(text) {
  return `[color="red"]${text}[/color]`;
}

function isVariantFiltered(cat, flags) {
  if (cat === "golden" && flags.filterGolds) return true;
  if (cat === "normal" && flags.filterNormals) return true;
  if (cat === "shiny"  && flags.filterShinys) return true;
  if (cat === "dark"   && flags.filterDarks) return true;
  return false;
}

// ===============================
// Fetch helpers
// ===============================

async function fetchDexMapping() {
  const res = await fetch("name_to_dex.json");
  if (!res.ok) throw new Error("Failed to fetch name_to_dex.json");
  const obj = await res.json();
  const nameToDex = {};
  for (const [k, v] of Object.entries(obj)) nameToDex[k] = Number(v);
  return nameToDex;
}

async function fetchEvolutionData() {
  const res = await fetch("pokemon_evolution.json");
  if (!res.ok) throw new Error("Failed to fetch pokemon_evolution.json");
  return res.json();
}

async function fetchUEUGSet() {
  const res = await fetch("ueug_list.txt");
  if (!res.ok) throw new Error("Failed to fetch ueug_list.txt");
  const text = await res.text();
  const lines = text.split(/\r?\n/);
  const names = [];
  for (const line of lines) {
    const t = line.trim();
    if (t) names.push(t);
  }
  return new Set(names.map((n) => canonicalKey(n)));
}

async function fetchRarityTable() {
  const res = await fetch("rarity.html");
  if (!res.ok) throw new Error("Failed to fetch TPPC rarity list.");
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, "text/html");

  const table = doc.querySelector("table");
  if (!table) throw new Error("Could not find rarity table.");

  const rows = Array.from(table.querySelectorAll("tr"));
  if (rows.length < 2) throw new Error("No rows in rarity table.");

  const headerCells = Array.from(rows[0].querySelectorAll("th, td")).map((c) => c.textContent.trim());
  const idxPokemon = headerCells.findIndex((h) => h.toLowerCase().startsWith("pok"));
  const idxUng = headerCells.findIndex((h) => h.toLowerCase().startsWith("ungendered"));
  if (idxPokemon === -1 || idxUng === -1) {
    throw new Error("Could not locate Pokémon/Ungendered columns in rarity table.");
  }

  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const cells = Array.from(rows[i].querySelectorAll("td"));
    if (cells.length <= Math.max(idxPokemon, idxUng)) continue;
    const pokemon = cells[idxPokemon].textContent.trim();
    const ungStr = cells[idxUng].textContent.replace(/,/g, "").trim();
    const ung = parseInt(ungStr, 10) || 0;
    out.push({ pokemon, ungendered: ung });
  }
  return out;
}

// ===============================
// Main logic
// ===============================

async function runDexSorter({
  inputText,
  minUngendered,
  maxMissing,
  flags, // {filterGolds, filterNormals, filterShinys, filterDarks}
  colors,
  statusEl,
  partitionOutput,
  missingOnlyFamilyNeeded,
  showLevelLabel,
  dropDuplicates,
  addMissingInline,
  noGroupSpacing
}) {
  statusEl.textContent = "Fetching Dex mapping...";
  const nameToDex = await fetchDexMapping();

  statusEl.textContent = "Loading evolution data...";
  const evoData = await fetchEvolutionData();
  const pokemonNameMap = evoData["pokemon_name"];
  const evolutionsMap = evoData["evolutions"];

  statusEl.textContent = "Building evolution graph...";
  const graph = new Map();
  const children = new Map();
  const parents = new Map();
  const evoDepth = {};

  function ensureSet(map, key) {
    if (!map.has(key)) map.set(key, new Set());
    return map.get(key);
  }

  for (const [idxStr, baseName] of Object.entries(pokemonNameMap)) {
    const baseKey = canonicalKey(baseName);
    const evoList = evolutionsMap[idxStr] || [];
    for (const evo of evoList) {
      const evoKey = canonicalKey(evo["pokemon_name"]);
      ensureSet(graph, baseKey).add(evoKey);
      ensureSet(graph, evoKey).add(baseKey);
      ensureSet(children, baseKey).add(evoKey);
      ensureSet(parents, evoKey).add(baseKey);
    }
    if (!graph.has(baseKey)) graph.set(baseKey, new Set());
  }

  statusEl.textContent = "Parsing input list...";
  const nameRegex = /^\s*([\w’'À-ÖØ-öø-ÿ-]+(?:\s*\([^)]+\))?)/;

  const raw = (inputText || "").replace(/\r\n/g, "\n").trim();
  if (!raw) throw new Error("No input provided.");

  // Detect compact "(Level: N)" blob format
  const levelMatches = raw.match(/\(Level:\s*[\d,]+\)/gi) || [];
  const lineCount = raw.split(/\n/).length;
  const isCompact = lineCount < 2 && levelMatches.length >= 2;

  let logicalLines = [];
  if (isCompact) {
    statusEl.textContent = "Detected compact '(Level: N)' format, pre-splitting...";
    const compactEntryRegex =
      /([A-Za-z0-9'’À-ÖØ-öø-ÿ-]+(?:\s*\([^)]+\))?\s*\(\?\))\s*\(Level:\s*([\d,]+)\)/g;

    let m;
    while ((m = compactEntryRegex.exec(raw)) !== null) {
      const name = m[1].trim();   // e.g. "DarkLugia (?)"
      const lvlRaw = m[2];        // e.g. "3,499"
      const lvlInt = parseInt(lvlRaw.replace(/,/g, ""), 10);
      const lvlFmt = Number.isFinite(lvlInt) ? lvlInt.toLocaleString("en-US") : lvlRaw.replace(/\s+/g, "");
      if (!name.includes("(?)")) continue;
      logicalLines.push(`${name} ${lvlFmt}`);
    }
  } else {
    logicalLines = raw.split("\n");
  }

  // Parse rows + apply filters + parse level for dedupe
  const tempRows = [];
  for (const rawLine of logicalLines) {
    const line = rawLine.trim();
    if (!line) continue;
    if (!line.includes("(?)")) continue;

    const m = line.match(nameRegex);
    if (!m) continue;

    const fullName = m[1].trim();
    const cat = colorCategory(fullName);
    if (isVariantFiltered(cat, flags)) continue;

    const afterName = line.slice(m[0].length).trim();
    let restParts = afterName.split(/\s+/).filter((x) => x.length > 0);
    if (restParts.length > 0 && restParts[restParts.length - 1].startsWith("$")) {
      restParts = restParts.slice(0, -1);
    }
    const remainder = restParts.join(" ");
    const { levelNum, levelStr } = parseLeadingLevelFromRemainder(remainder);

    tempRows.push({
      line,
      full_name: fullName,
      levelNum,
      levelStr,
    });
  }

  if (tempRows.length === 0) {
    throw new Error("No valid Pokémon lines with '(?)' found in input (after filters).");
  }

  let rows;
  if (dropDuplicates) {
    const best = new Map(); // canonical(full_name) -> row
    for (const r of tempRows) {
      const key = canonicalKey(r.full_name);
      if (!best.has(key)) {
        best.set(key, r);
        continue;
      }
      const cur = best.get(key);
      const a = r.levelNum;
      const b = cur.levelNum;
      const chooseNew =
        (a !== null && b === null) ||
        (a !== null && b !== null && a < b);
      if (chooseNew) best.set(key, r);
    }
    rows = Array.from(best.values());
  } else {
    rows = tempRows;
  }

  // Attach species + dex
  const missingSpecies = [];
  for (const r of rows) {
    const species = speciesFromFullName(r.full_name);
    r.species = species;

    const key = canonicalKey(species);
    let dex = nameToDex[key];
    if (dex === undefined) {
      missingSpecies.push(species);
      dex = 9999;
    }
    r.dex = dex;
  }
  if (missingSpecies.length > 0) {
    console.warn("WARNING: Could not find dex for:", Array.from(new Set(missingSpecies)));
  }

  // Compute evolution families (components) and depths (from evolution JSON)
  statusEl.textContent = "Computing evo families & depths...";
  const rowSpeciesKeys = new Set();
  for (const r of rows) {
    const k = canonicalKey(r.species);
    rowSpeciesKeys.add(k);
    if (!graph.has(k)) graph.set(k, new Set());
  }

  const familyAnchor = {};           // speciesKey -> familyId
  const familyMembers = new Map();   // familyId -> Set(speciesKey)
  const visited = new Set();

  for (const start of rowSpeciesKeys) {
    if (visited.has(start)) continue;

    const stack = [start];
    const component = new Set();

    while (stack.length > 0) {
      const u = stack.pop();
      if (visited.has(u)) continue;
      visited.add(u);
      component.add(u);
      const nbrs = graph.get(u) || new Set();
      for (const v of nbrs) if (!visited.has(v)) stack.push(v);
    }

    const present = new Set();
    for (const k of component) if (rowSpeciesKeys.has(k)) present.add(k);

    let minDex = Infinity;
    const sourceSet = present.size > 0 ? present : component;
    for (const k of sourceSet) {
      const d = nameToDex[k] ?? 9999;
      if (d < minDex) minDex = d;
    }
    if (!Number.isFinite(minDex)) minDex = 9999;

    if (!familyMembers.has(minDex)) familyMembers.set(minDex, new Set());
    const famSet = familyMembers.get(minDex);
    for (const k of component) famSet.add(k);

    for (const k of component) familyAnchor[k] = minDex;

    // evoDepth in component
    const componentList = Array.from(component);
    const roots = [];

    for (const k of componentList) {
      const parentSet = parents.get(k);
      const hasParentInComponent =
        parentSet && Array.from(parentSet).some((p) => component.has(p));
      if (!hasParentInComponent) roots.push(k);
    }

    if (roots.length === 0) {
      let minRoot = componentList[0];
      let bestDex = nameToDex[minRoot] ?? 9999;
      for (const k of componentList.slice(1)) {
        const d = nameToDex[k] ?? 9999;
        if (d < bestDex) { bestDex = d; minRoot = k; }
      }
      roots.push(minRoot);
    }

    const queue = [];
    const seenLocal = new Set();
    for (const rroot of roots) queue.push([rroot, 0]);

    while (queue.length > 0) {
      const [node, depth] = queue.shift();
      if (seenLocal.has(node)) continue;
      seenLocal.add(node);

      if (evoDepth[node] === undefined || depth < evoDepth[node]) evoDepth[node] = depth;

      const childSet = children.get(node) || new Set();
      for (const child of childSet) if (component.has(child)) queue.push([child, depth + 1]);
    }
  }

  function getFamilyId(speciesName) {
    const k = canonicalKey(speciesName);
    if (familyAnchor[k] !== undefined) return familyAnchor[k];
    const d = nameToDex[k];
    return d !== undefined ? d : 9999;
  }

  // Sort rows (dex+family+depth+forms+colors)
  statusEl.textContent = "Sorting Pokémon...";
  const rowsSorted = rows.slice().sort((a, b) => {
    const familyA = getFamilyId(a.species);
    const familyB = getFamilyId(b.species);

    const depthA = evoDepth[canonicalKey(a.species)] ?? 0;
    const depthB = evoDepth[canonicalKey(b.species)] ?? 0;

    const baseA = speciesFromFullName(a.full_name);
    const baseB = speciesFromFullName(b.full_name);

    const frA = formRank(extractForm(a.full_name));
    const frB = formRank(extractForm(b.full_name));

    const crA = colorRank(a.full_name);
    const crB = colorRank(b.full_name);

    // Ensure color ordering is respected before name tie-breakers
    const keyA = [familyA, depthA, a.dex, frA, crA, baseA.toLowerCase(), a.full_name];
    const keyB = [familyB, depthB, b.dex, frB, crB, baseB.toLowerCase(), b.full_name];
    return compareTuple(keyA, keyB);
  });

  // UE/UG list
  statusEl.textContent = "Fetching UE/UG list...";
  const ueugSet = await fetchUEUGSet();

  function decorateName(fullName) {
    const cat = colorCategory(fullName);
    const baseForUeug = stripPrefixes(fullName);
    const key = canonicalKey(baseForUeug);
    const isUeugNormal = cat === "normal" && ueugSet.has(key);

    const wrapColor = (color, text) =>
      color && color.trim().length > 0 ? `[color="${color.trim()}"]${text}[/color]` : text;

    if (cat === "dark") return wrapColor(colors.dark, fullName);
    if (cat === "shiny") return wrapColor(colors.shiny, fullName);
    if (cat === "golden") return wrapColor(colors.golden, fullName);

    let name = fullName;
    if (isUeugNormal) name = `[B]${name}[/B]`;
    return wrapColor(colors.normal, name);
  }

  // Fetch rarity early (for family-vs-single based on rarity existence + for inline missing)
  statusEl.textContent = "Fetching rarity...";
  const rarityRowsAll = await fetchRarityTable();

  // --- NEW: rarity lookup + base-evolution resolver (for inline missing strike-through) ---
  const rarityByKey = new Map(); // canonicalKey(pokemonName) -> ungendered count
  for (const rr of rarityRowsAll) {
    rarityByKey.set(canonicalKey(rr.pokemon), rr.ungendered);
  }

  // canonical species key -> a nice display name (from evo json), fallback handled later
  const speciesDisplayByKey = {};
  for (const nm of Object.values(pokemonNameMap)) {
    const k = canonicalKey(nm);
    if (!(k in speciesDisplayByKey)) speciesDisplayByKey[k] = nm;
  }

  // Walk "parents" to find the base evolution species key.
  // If multiple parents exist, pick the one with the lowest dex (stable tie-break).
  function baseEvolutionKey(speciesKey) {
    let cur = speciesKey;
    while (true) {
      const pset = parents.get(cur);
      if (!pset || pset.size === 0) break;

      let best = null;
      let bestDex = Infinity;
      for (const p of pset) {
        const d = nameToDex[p] ?? 9999;
        if (d < bestDex) { bestDex = d; best = p; }
      }
      if (!best) break;
      cur = best;
    }
    return cur;
  }

  function variantPrefixFromName(fullName) {
    const cat = colorCategory(fullName);
    if (cat === "golden") return "Golden";
    if (cat === "shiny") return "Shiny";
    if (cat === "dark") return "Dark";
    return ""; // normal
  }

  function shouldStrikeInlineMissing(missingFullName, missingSpecies) {
    // missingFullName is like "ShinyNidorina (?)"
    const prefix = variantPrefixFromName(missingFullName); // "Shiny" / "Dark" / "Golden" / ""
    const sk = canonicalKey(missingSpecies);
    const baseKey = baseEvolutionKey(sk);
    const baseSpeciesName = speciesDisplayByKey[baseKey] ?? missingSpecies;

    const lookupName = prefix ? `${prefix}${baseSpeciesName}` : baseSpeciesName;
    const baseRarity = rarityByKey.get(canonicalKey(lookupName));

    return Number.isFinite(baseRarity) && baseRarity <= 10;
  }
  // --- END NEW BLOCK ---


  // Species present in rarity list at all (respecting variant filters)
  const raritySpeciesKeysPresent = new Set();
  for (const rr of rarityRowsAll) {
    const cat = colorCategory(rr.pokemon);
    if (isVariantFiltered(cat, flags)) continue;
    const sk = canonicalKey(speciesFromFullName(rr.pokemon));
    raritySpeciesKeysPresent.add(sk);
  }

  // For each component familyId: how many species in that component have ANY ungendered entry in rarity list
  const rarityFamilySize = new Map(); // famId -> count
  for (const [famId, members] of familyMembers.entries()) {
    let c = 0;
    for (const sk of members) if (raritySpeciesKeysPresent.has(sk)) c++;
    rarityFamilySize.set(famId, c);
  }

  // ===============================
  // Missing list computation
  // ===============================
  statusEl.textContent = "Computing missing list...";

  const haveKeys = new Set(rowsSorted.map((r) => canonicalKey(r.full_name)));

  const candidates = rarityRowsAll
    .filter((row) => row.ungendered > minUngendered)
    .sort((a, b) => b.ungendered - a.ungendered);

  // Incomplete families (multi-species in rarity) = any missing entry (any allowed variant) in that family
  const incompleteFamilyIds = new Set();
  for (const row of candidates) {
    const pokeName = row.pokemon;
    const cat = colorCategory(pokeName);
    if (isVariantFiltered(cat, flags)) continue;

    const key = canonicalKey(pokeName);
    if (haveKeys.has(key)) continue;

    const famId = getFamilyId(speciesFromFullName(pokeName));
    const famSize = rarityFamilySize.get(famId) ?? 1;
    if (famSize > 1) incompleteFamilyIds.add(famId);
  }

  const missingByVariant = { golden: [], shiny: [], dark: [], normal: [] };
  const missingByFamily = new Map(); // famId -> array of { name, u }

  for (const row of candidates) {
    const pokeName = row.pokemon;
    const cat = colorCategory(pokeName);
    if (isVariantFiltered(cat, flags)) continue;

    const key = canonicalKey(pokeName);
    if (haveKeys.has(key)) continue;

    const famId = getFamilyId(speciesFromFullName(pokeName));
    const famSize = rarityFamilySize.get(famId) ?? 1;

    if (missingOnlyFamilyNeeded) {
      if (famSize <= 1) continue;
      if (!incompleteFamilyIds.has(famId)) continue;
    }

    missingByVariant[cat].push({ name: pokeName, u: row.ungendered });

    if (!missingByFamily.has(famId)) missingByFamily.set(famId, []);
    missingByFamily.get(famId).push({ name: pokeName, u: row.ungendered });
  }

  // ===============================
  // Output formatting
  // ===============================

  statusEl.textContent = "Formatting sorted output...";

  function formatExistingRow(r) {
    const origLine = r.line;
    const m = origLine.match(nameRegex);
    if (!m) return origLine;

    const afterName = origLine.slice(m[0].length).trim();
    const decorated = decorateName(r.full_name);

    let restParts = afterName.split(/\s+/).filter((x) => x.length > 0);
    if (restParts.length > 0 && restParts[restParts.length - 1].startsWith("$")) {
      restParts = restParts.slice(0, -1);
    }
    let remainder = restParts.join(" ");
    if (showLevelLabel && remainder) remainder = applyLevelLabelToRemainder(remainder);

    return remainder ? `${decorated} ${remainder}` : decorated;
  }

  // Group existing rows by family
  const rowsByFamily = new Map();
  for (const r of rowsSorted) {
    const famId = getFamilyId(r.species);
    if (!rowsByFamily.has(famId)) rowsByFamily.set(famId, []);
    rowsByFamily.get(famId).push(r);
  }

  // Sort-key used when merging existing+missing inline
  function sortKeyForItem(item) {
    const familyId = getFamilyId(item.species);
    const depth = evoDepth[canonicalKey(item.species)] ?? 0;
    const dex = item.dex ?? (nameToDex[canonicalKey(item.species)] ?? 9999);
    const fr = formRank(extractForm(item.full_name));
    const cr = colorRank(item.full_name);
    const base = speciesFromFullName(item.full_name);

    // Color comes before base tie-breakers to guarantee normal->dark->shiny->golden
    return [familyId, depth, dex, fr, cr, base.toLowerCase(), item.full_name];
  }

  function cmpItems(a, b) {
    return compareTuple(sortKeyForItem(a), sortKeyForItem(b));
  }

  const familyLines = [];
  const singleLines = [];

  const famIdsInOrder = Array.from(rowsByFamily.keys()).sort((a, b) => a - b);

  for (const famId of famIdsInOrder) {
    const famSizeRarity = rarityFamilySize.get(famId) ?? 1;
    const isSingleSet = partitionOutput && famSizeRarity <= 1;
    const target = isSingleSet ? singleLines : familyLines;

    if (!noGroupSpacing && target.length > 0) target.push("");

    const existing = rowsByFamily.get(famId) || [];

    // If not adding inline, or it's a single-set group, just output what we have
    if (!addMissingInline || isSingleSet || famSizeRarity <= 1) {
      for (const r of existing) target.push(formatExistingRow(r));
      continue;
    }

    // Merge existing + missing-in-family, sort, output (missing in red)
    const items = [];

    for (const r of existing) {
      items.push({
        kind: "have",
        full_name: r.full_name, // includes (?) marker already
        species: r.species,
        dex: r.dex,
        row: r,
      });
    }

    const missingListForFamily = missingByFamily.get(famId) || [];
    for (const miss of missingListForFamily) {
      // Display: "VariantName (?)" (no level)
      const displayName = `${miss.name} (?)`;
      const species = speciesFromFullName(miss.name);
      const dex = nameToDex[canonicalKey(species)] ?? 9999;

      // IMPORTANT: full_name includes "(?)" so existing & missing use the same form parsing
      items.push({
        kind: "missing",
        full_name: `${miss.name} (?)`,
        display: displayName,
        species,
        dex,
      });
    }

    items.sort(cmpItems);

    for (const it of items) {
      if (it.kind === "have") target.push(formatExistingRow(it.row));
      else {
        let out = decorateMissingInline(it.display);
        if (shouldStrikeInlineMissing(it.full_name, it.species)) {
          out = `[s]${out}[/s]`;
        }
        target.push(out);
      }
    }
  }

  const familiesSortedOutput = familyLines.join("\n");
  const singlesSortedOutput  = singleLines.join("\n");

  // ===============================
  // Summary stats
  // ===============================
  statusEl.textContent = "Computing summary stats...";

  const shinyKeys = new Set();
  const darkKeys = new Set();
  const goldenKeys = new Set();
  const normalKeys = new Set();
  const ueugNormalKeys = new Set();

  for (const r of rowsSorted) {
    const fullName = r.full_name;
    const baseKey = canonicalKey(speciesFromFullName(fullName));
    const cat = colorCategory(fullName);

    if (cat === "shiny") shinyKeys.add(baseKey);
    else if (cat === "dark") darkKeys.add(baseKey);
    else if (cat === "golden") goldenKeys.add(baseKey);
    else {
      normalKeys.add(baseKey);
      const keyUeug = canonicalKey(stripPrefixes(fullName));
      if (ueugSet.has(keyUeug)) ueugNormalKeys.add(baseKey);
    }
  }

  const summaryLines = [];
  summaryLines.push("=== Summary Stats ===");
  summaryLines.push(`Unique Shiny species:  ${shinyKeys.size}`);
  summaryLines.push(`Unique Dark species:   ${darkKeys.size}`);
  summaryLines.push(`Unique Golden species: ${goldenKeys.size}`);
  summaryLines.push(`Unique Normal species: ${normalKeys.size}`);
  summaryLines.push(`UE/UG Normal species you have: ${ueugNormalKeys.size}`);
  summaryLines.push("* Note: Unowns are only counted once.");
  summaryLines.push("");

  // ===============================
  // Missing list output text
  // ===============================
  function sliceVariant(list) {
    if (maxMissing && maxMissing > 0) return list.slice(0, maxMissing);
    return list;
  }

  const missingLines = [];
  missingLines.push(
    `=== Missing Ungendered > ${minUngendered} (per variant; ${
      maxMissing && maxMissing > 0 ? "up to " + maxMissing + " shown per variant" : "all shown"
    }) ===`
  );

  const filterNotes = [];
  if (flags.filterGolds) filterNotes.push("Goldens filtered");
  if (flags.filterNormals) filterNotes.push("Normals filtered");
  if (flags.filterShinys) filterNotes.push("Shinys filtered");
  if (flags.filterDarks) filterNotes.push("Darks filtered");
  if (dropDuplicates) filterNotes.push("Duplicates dropped");
  if (filterNotes.length) missingLines.push(`Filters: ${filterNotes.join(", ")}.`);
  if (missingOnlyFamilyNeeded) missingLines.push("Filter: only missing entries that belong to incomplete multi-species families.");
  if (addMissingInline) missingLines.push('Note: Missing items are also added inline in the Families output (in red).');

  function emitVariant(label, variantKey) {
    const all = missingByVariant[variantKey];
    if (!all || all.length === 0) return;
    const shown = sliceVariant(all);

    missingLines.push("");
    missingLines.push(`--- ${label} ---`);
    missingLines.push(`Total missing ${label.toLowerCase()}: ${all.length}`);

    if (shown.length === 0) {
      missingLines.push("You have all of them.");
    } else {
      for (const { name, u } of shown) {
        missingLines.push(`${name}: Ungendered = ${u}`);
      }
    }
  }

  if (!flags.filterGolds)  emitVariant("Golden", "golden");
  if (!flags.filterShinys) emitVariant("Shiny", "shiny");
  if (!flags.filterDarks)  emitVariant("Dark", "dark");
  if (!flags.filterNormals) emitVariant("Normal", "normal");

  statusEl.textContent = "Done.";

  const familiesBbcodeBlock = ["[code]", familiesSortedOutput, "[/code]"].join("\n");
  const singlesBbcodeBlock  = ["[code]", singlesSortedOutput,  "[/code]"].join("\n");

  const mainText = summaryLines.join("\n") + "\n" + familiesBbcodeBlock;
  const secondaryText = partitionOutput ? singlesBbcodeBlock : "";
  const missingText = missingLines.join("\n");

  return { mainText, missingText, secondaryText };
}

// ===============================
// UI wiring
// ===============================

const runButton = document.getElementById("runButton");
const backButton = document.getElementById("backButton");
const statusEl = document.getElementById("status");

const inputView = document.getElementById("input-view");
const outputView = document.getElementById("output-view");

const inputListEl = document.getElementById("inputList");
const outputTextEl = document.getElementById("outputText");
const outputMissingEl = document.getElementById("outputMissing");
const outputSinglesEl = document.getElementById("outputSingles");
const familiesSinglesBlock = document.getElementById("familiesSinglesBlock");

const minUngEl = document.getElementById("minUngendered");
const maxMissEl = document.getElementById("maxMissing");

const partitionOutputEl = document.getElementById("partitionOutput");

const filterGoldsEl = document.getElementById("filterGolds");
const filterNormalsEl = document.getElementById("filterNormals");
const filterShinysEl = document.getElementById("filterShinys");
const filterDarksEl = document.getElementById("filterDarks");

const missingOnlyFamilyNeededEl = document.getElementById("missingOnlyFamilyNeeded");
const addMissingInlineEl = document.getElementById("addMissingInline");
const noGroupSpacingEl = document.getElementById("noGroupSpacing");

const showLevelLabelEl = document.getElementById("showLevelLabel");
const dropDuplicatesEl = document.getElementById("dropDuplicates");

const colorGoldenEl = document.getElementById("colorGolden");
const colorShinyEl = document.getElementById("colorShiny");
const colorDarkEl = document.getElementById("colorDark");
const colorNormalEl = document.getElementById("colorNormal");

runButton.addEventListener("click", async () => {
  const inputText = inputListEl.value.trim();
  if (!inputText) {
    statusEl.textContent = "Please paste your list first.";
    return;
  }

  const minUngendered = parseInt(minUngEl.value, 10);
  const maxMissing = parseInt(maxMissEl.value, 10);

  const flags = {
    filterGolds: filterGoldsEl.checked,
    filterNormals: filterNormalsEl.checked,
    filterShinys: filterShinysEl.checked,
    filterDarks: filterDarksEl.checked,
  };

  const partitionOutput = partitionOutputEl.checked;
  const missingOnlyFamilyNeeded = missingOnlyFamilyNeededEl.checked;
  const showLevelLabel = showLevelLabelEl.checked;
  const dropDuplicates = dropDuplicatesEl.checked;
  const addMissingInline = addMissingInlineEl.checked;
  const noGroupSpacing = noGroupSpacingEl.checked;

  const colors = {
    golden: colorGoldenEl.value || "",
    shiny: colorShinyEl.value || "",
    dark: colorDarkEl.value || "",
    normal: colorNormalEl.value || "",
  };

  runButton.disabled = true;
  statusEl.textContent = "Running sorter...";

  try {
    const { mainText, missingText, secondaryText } = await runDexSorter({
      inputText,
      minUngendered: Number.isFinite(minUngendered) ? minUngendered : 10,
      maxMissing: Number.isFinite(maxMissing) ? maxMissing : 20,
      flags,
      colors,
      statusEl,
      partitionOutput,
      missingOnlyFamilyNeeded,
      showLevelLabel,
      dropDuplicates,
      addMissingInline,
      noGroupSpacing
    });

    outputTextEl.value = mainText;
    outputMissingEl.value = missingText;

    if (partitionOutput) {
      familiesSinglesBlock.classList.remove("d-none");
      outputSinglesEl.value = secondaryText || "";
    } else {
      familiesSinglesBlock.classList.add("d-none");
      outputSinglesEl.value = "";
    }

    inputView.classList.add("d-none");
    outputView.classList.remove("d-none");
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + err.message;
  } finally {
    runButton.disabled = false;
  }
});

backButton.addEventListener("click", () => {
  outputView.classList.add("d-none");
  inputView.classList.remove("d-none");
  statusEl.textContent = "";
});
</script>
